[project]
name = "smtpsift"
version = "0.1.0"
description = "Classify SMTP rejections and deferrals into actions you can actually take"
requires-python = ">=3.9"
authors = [{name = "Rastu Singh"}]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
smtpsift = "smtpsift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
